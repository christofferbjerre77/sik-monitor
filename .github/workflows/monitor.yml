name: SIK autorisationsovervågning

on:
  schedule:
    # Kører hvert 15. minut, døgnet rundt (UTC-tid).
    # Repository er offentligt, så Actions-minutter er gratis og ubegrænset.
    # (Sat ned fra hvert 5. minut til hvert 15. minut for mere stabil drift -
    # registret opdateres kun nogle få gange i døgnet, så forskellen i
    # opdagelsestid er ubetydelig, mens færre kørsler giver færre kø-problemer.)
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      send_test_notification:
        description: "Send en TEST-besked til Discord/Slack i stedet for at tjekke registret (bruges til at bekræfte at webhooken virker)"
        type: boolean
        default: false

# Forhindrer flere kørsler i at køre samtidig. Uden dette kan to kørsler
# begge forsøge at committe/pushe tilstand på samme tid, hvilket giver
# konflikter og hængende/langsomme kørsler. Nye kørsler venter nu pænt i kø
# i stedet for at kollidere med hinanden.
concurrency:
  group: sik-monitor-run
  cancel-in-progress: false

permissions:
  contents: write  # nødvendigt for at scriptet kan gemme sin tilstand tilbage i repo'et

jobs:
  check-for-new-authorizations:
    runs-on: ubuntu-latest
    steps:
      - name: Hent repo
        uses: actions/checkout@v4

      - name: Opsæt Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installér afhængigheder
        run: pip install -r requirements.txt

      - name: Kør overvågningsscript
        env:
          SIK_WEBHOOK_URL: ${{ secrets.SIK_WEBHOOK_URL }}
        run: |
          if [ "${{ inputs.send_test_notification }}" = "true" ]; then
            python monitor_sik.py --test-webhook
          else
            python monitor_sik.py
          fi

      - name: Gem tilstand (commit ændringer)
        run: |
          git config user.name "sik-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          git diff --quiet --cached || git commit -m "Opdater tilstand [skip ci]"
          git push
